[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.9.60"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# ── 内部 crate（路径依赖单源）──
starfish-std = { path = "crates/starfish-std" }
starfish-we = { path = "crates/starfish-we" }
starfish-time = { path = "crates/starfish-time" }
starfish-permission = { path = "crates/starfish-permission" }
starfish-io = { path = "crates/starfish-io" }
starfish-net = { path = "crates/starfish-net" }
starfish-dialog = { path = "crates/starfish-dialog" }
starfish-gamepad = { path = "crates/starfish-gamepad" }
starfish-render = { path = "crates/starfish-render" }
starfish-gfx = { path = "crates/starfish-gfx" }
starfish-font = { path = "crates/starfish-font" }
starfish-audio = { path = "crates/starfish-audio" }
starfish-video = { path = "crates/starfish-video" }
starfish-pygame = { path = "crates/starfish-pygame" }


# egui-sfwe = { path = "crates/egui-sfwe" }
# rapier-sf = {}
# tiled-sf = {}
# voxelis-sf = {}


# Android 示例 log→logcat 桥（examples dev-dep）
android_logger = "0.15"

# ── 渲染 ──
wgpu = { version = "30.0.1", default-features = false, features = [
    "std", "parking_lot", "dx12", "metal", "vulkan", "gles", "wgsl", "webgl", "webgpu",
] }
raw-window-handle = "0.6"
pollster = "0.4"

# ── 音频 ──
cpal = "0.18"
symphonia = { version = "0.5", default-features = false, features = [
    "ogg", "mp3", "flac", "wav", "pcm", "aac",
] }

# ── 数学 / 几何 / 资源 ──
glam = { version = "0.33.2", features = ["bytemuck"] }
image = "0.25.10"
ttf-parser = "0.25.1"
bytemuck = { version = "1.23", features = ["derive"] }

# ── 错误 / 派生 / 数据 / 日志 ──
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
once_cell = "1.21.4"
log = "0.4"

# ── 视频解复用 / Android ──
mp4 = "0.14"
jni = "0.21"
ndk-context = "0.1"
robius-android-env = "0.2"

# ── 桌面对话框 / 手柄 ──
gilrs = "0.11"
rfd = "0.15"

# ── Web（features 取全工作区并集，成员可按需叠加）──
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "console", "CssStyleDeclaration", "DomRect", "Window", "Event", "EventTarget",
    "FocusEvent", "HtmlElement", "KeyboardEvent", "MouseEvent", "ResizeObserver",
    "Touch", "TouchEvent", "TouchList", "VisibilityState", "WheelEvent", "Performance",
    "Document", "Element", "HtmlCanvasElement", "Response", "MessageEvent",
    "HtmlInputElement", "Headers", "Request", "RequestInit", "File", "FileList",
    "Blob", "Url", "Location", "Navigator", "MediaDevices", "MediaStreamConstraints",
    "MediaStream", "MediaStreamAudioSourceNode", "AudioContext", "ScriptProcessorNode",
    "AudioProcessingEvent", "AudioBuffer", "AudioDestinationNode",
] }

# ── 平台窗口 / 视频后端 ──
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Media_MediaFoundation", "Win32_Media_DirectShow", "Win32_System_Com",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSColor", "NSCursor", "NSEvent", "NSScreen", "NSView",
    "NSWindow", "NSResponder",
] }
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication", "UIWindow", "UIView", "UIColor", "UIScreen", "UIResponder",
    # iOS 输入投递（platform/ios）：触摸、软键盘拦截字段、硬件按键
    "UITouch", "UIEvent", "UITextInputTraits", "UITextField",
    "UIKey", "UIKeyConstants", "UICommand", "UIPress", "UIPressesEvent",
    "objc2-quartz-core",
] }
objc2-quartz-core = "0.3"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSRunLoop", "NSProcessInfo", "NSSet"] }
objc2-av-foundation = { version = "0.3", features = [
    "AVAsset", "AVAssetTrack", "AVAssetReader", "AVAssetReaderOutput", "AVMediaFormat",
    "objc2-core-media",
] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "CMTime"] }
objc2-core-video = { version = "0.3", features = [
    "CVPixelBuffer", "CVImageBuffer", "CVBase", "CVBuffer", "CVReturn",
] }
objc2-video-toolbox = { version = "0.3", features = [
    "VTDecompressionSession", "VTErrors", "VTSession",
] }
objc2-core-foundation = "0.3"
wayland-client = { version = "0.31", features = ["system", "dlopen"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon", "system"] }
sctk-adwaita = "0.12.0"
android-activity = { version = "0.6", features = ["native-activity"] }
robius-file-picker = "0.3"
gstreamer = { version = "0.23", features = ["v1_24"] }
gstreamer-app = "0.23"
gstreamer-video = "0.23"
