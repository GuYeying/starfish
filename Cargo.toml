path = "examples/probe/probe_record.rs"
crate-type = ["cdylib"]
required-features = ["font"]

[[example]]
name = "probe_dialog"
path = "examples/probe/probe_dialog.rs"
required-features = ["dialog", "font"]

[[example]]
name = "probe_dialog_android"
path = "examples/probe/probe_dialog.rs"
crate-type = ["cdylib"]
required-features = ["dialog", "font"]

[[example]]
name = "probe_gamepad"
path = "examples/probe/probe_gamepad.rs"
required-features = ["gamepad", "font"]

[[example]]
name = "probe_gamepad_android"
path = "examples/probe/probe_gamepad.rs"
crate-type = ["cdylib"]
required-features = ["gamepad", "font"]

[[example]]
name = "probe_gfx"
path = "examples/probe/probe_gfx.rs"
required-features = ["gfx", "font"]

[[example]]
name = "probe_gfx_android"
path = "examples/probe/probe_gfx.rs"
crate-type = ["cdylib"]
required-features = ["gfx", "font"]

[[example]]
name = "probe_net"
path = "examples/probe/probe_net.rs"
