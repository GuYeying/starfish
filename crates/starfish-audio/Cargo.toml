[package]
name = "starfish-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "音频引擎：cpal 设备层 + symphonia 解码 + 混音器/流式/录音（平台中立纯逻辑）"

# ── 特性 ──
# dialog（可选）：录音保存走系统文件对话框（record.rs）；不启用则零成本。
[features]
default = ["dialog"]
dialog = ["dep:starfish-dialog"]

[dependencies]
starfish-debug = { workspace = true }
starfish-permission = { workspace = true }
starfish-io = { workspace = true }
starfish-dialog = { workspace = true, optional = true }
symphonia = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }

# 原生设备层：cpal 胶水（device.rs 唯一收敛点——上层零 cpal 类型）。
# OHOS 摘除：ohos 目标 target_os="linux"（rustc --print cfg 实测
# 2026-11-11）——cpal 会拉 ALSA 主机（alsa-sys 构建脚本在 OHOS 无
# pkg-config/alsa 实证失败）；OHOS 走 device.rs 桩分支，真适配 =
# OHAudio 实现同接口（pygamest reference/新平台扩展指南）。
[target.'cfg(not(any(target_arch = "wasm32", all(target_os = "linux", target_env = "ohos"))))'.dependencies]
cpal = { workspace = true }

# Web：cpal WebAudio 设备后端；getUserMedia 录音采集（device.rs wasm 输入分支）
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }
