[package]
name = "starfish-dialog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "文件打开/保存对话框（统一异步 API）：桌面 rfd / 移动 roibus / Web input+FileReader，保存=下载"

[dependencies]
starfish-permission = { workspace = true }
# dialog.rs 诊断打点用 log（注意：旧单 crate 里 log 是 optional 且从未被
# 任何 feature 启用，属既有缺陷；此处改为非可选修正之）
log = { workspace = true }

# 桌面：rfd 原生（Windows / Linux-GTK3 / macOS；同步阻塞 API）
# Linux 构建注意：rfd 后端为 GTK3，需 libgtk-3-dev
[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
rfd = { workspace = true }

# 移动端：robius-file-picker（Android 构建需 ANDROID_JAR 环境变量）
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
robius-file-picker = { workspace = true }

# Android 专属：Fragment 对话框的 JNI 桥 + robius 环境桥（crate 化时
# 从旧单 crate 的 android 依赖段漏带——批次三十四出包时补回）
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
robius-android-env = "0.2"

# Web：<input type=file> + FileReader 读；保存 = Blob + objectURL 触发下载
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
