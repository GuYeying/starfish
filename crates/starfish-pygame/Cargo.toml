[package]
name = "starfish-pygame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "pygame 兼容层：接口形态 1:1 对齐 pygame，执行 GPU 化（GPU 路线 Surface + 单一通用渲染管线，camera 即 MVP）"

[features]
# 鼠标事件穿透（桌宠形态配套；穿透设计稿 M1——starfish-we click-through
# 能力位透传；Win32 实装，macos/linux 站桩，web/mobile Err 垫底）
click-through = ["starfish-we/click-through"]
# 任务栏/Dock 隐藏（桌宠配套——starfish-we skip-taskbar 能力位透传；
# Win32/macOS 实装，Linux Wayland 站桩，web/mobile Err 垫底）
skip-taskbar = ["starfish-we/skip-taskbar"]
# 系统托盘（starfish-we tray 能力位透传——tray-icon 三桌面后端）；
# 事件经 poll_event 以 Event::Tray 上浮
tray = ["starfish-we/tray"]

# 依赖单向（契约硬性规则）：本层可直用各引擎 crate 类型；引擎 crate 永不感知本层。
[dependencies]
pollster = { workspace = true }
starfish-std = { workspace = true }
starfish-debug = { workspace = true }
starfish-we = { workspace = true }
starfish-time = { workspace = true }
starfish-permission = { workspace = true }
starfish-io = { workspace = true }
# 资源加密面（加密红线 2026-11-03：SFXE1/密钥/哈希/解密唯一归属本 crate
# ——starfish 其余 crate 零加密语义，io 只做字节搬运）
chacha20poly1305 = { workspace = true }
sha2 = "0.10"
starfish-net = { workspace = true }
starfish-dialog = { workspace = true }
starfish-gamepad = { workspace = true }
starfish-render = { workspace = true, features = ["we"] }
starfish-gfx = { workspace = true }
starfish-font = { workspace = true }
starfish-audio = { workspace = true }
starfish-video = { workspace = true }

wgpu = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
once_cell = { workspace = true }
log = { workspace = true }

# Web：mixer 手势门 / 诊断输出等
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
