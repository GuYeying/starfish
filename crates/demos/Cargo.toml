[package]
name = "demos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "starfish 示例与三端自检套件（hello + pygame 全模块运行测试）"

# 多窗口自检示例透传（平台白名单由 starfish-we 编译期把关，当前仅 Windows）
[features]
multi-window = ["starfish-we/multi-window"]

[dependencies]
starfish-pygame = { workspace = true }
# Android 构建需 we feature（app_entry! 的 android_main 宿主装配）
starfish-std = { workspace = true, features = ["we"] }
starfish-we = { workspace = true }
starfish-time = { workspace = true }
starfish-gamepad = { workspace = true }
starfish-render = { workspace = true }
starfish-gfx = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }

# Web 示例：app_entry! 宏展开的 #[wasm_bindgen(start)] 属性路径
# （宏约束：Web 构建要求用户 crate 可见 wasm-bindgen）
[dev-dependencies]
wasm-bindgen = { workspace = true }

# Android 示例：log→logcat 桥（wgpu/内部 log::error 无桥时在 Android 上不可见）
[target.'cfg(target_os = "android")'.dev-dependencies]
android_logger = "0.15"
log = { workspace = true }



[[example]]
name = "triangle"

[[example]]
name = "triangle_test"
path = "triangle.rs"

# ── hello：starfish-we + wgpu 绿屏渲染 ──
[[example]]
name = "hello"

[[example]]
name = "hello_android"
path = "hello.rs"
crate-type = ["cdylib"]

# ── multi_window：多窗口自检（new_context + 双 new_surface 共享设备族）──
# multi-window 平台白名单见 starfish-we（当前仅 Windows 桌面）；Android/Web
# 在白名单外编译期报错，故无 _android 双注册。
[[example]]
name = "multi_window"
required-features = ["multi-window"]

# ── pygame render 探针：纹理 quad + 图元 + 文字上屏（P2 验收）──
[[example]]
name = "pygame_probe"

[[example]]
name = "pygame_probe_android"
path = "pygame_probe.rs"
crate-type = ["cdylib"]

# ── pygame hello：API 面教程对照（P3 验收）──
