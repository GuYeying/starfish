[package]
name = "starfish-we"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "跨平台窗口 + 事件 crate（SDL 风格 poll 模型）：调用方持主循环，主动轮询事件；multi-window feature 开多窗（平台白名单编译期把关）"

# ── 特性 ──
# we-wgpu：实现 raw-window-handle traits——`instance.create_surface(&window)`
#   零 unsafe 直通；刻意不依赖 wgpu 本体。
# wgpu-auto：自动适配 surface（库接管 resize→configure 循环），引入 wgpu。
# multi-window：多窗口（每窗独立事件队列；平台白名单经 lib.rs 编译期
#   compile_error 把关——行为差异过大，不做运行期静默降级）。
[features]
default = []
# 嵌入模式（Android 外部 Surface 注入门面）：防止不经意外用——
# 开启后 starfish_we::embedded 门面才存在；窗口层对嵌入状态的钩子
# 常驻（未 attach 时零成本休眠，行为同 glue）
embedded = []
we-wgpu = ["dep:raw-window-handle"]
wgpu-auto = ["we-wgpu", "dep:wgpu"]
multi-window = []
# 鼠标事件穿透（桌宠形态配套；穿透设计稿 M1——Win32 实装，
# macos/linux 站桩预留，各平台模块各自实装；web/mobile 无此概念 Err 垫底）
click-through = []
# 任务栏/Dock 隐藏（桌宠配套——Win=WS_EX_TOOLWINDOW 位切换、
# macOS=Dock 级 setActivationPolicy 切换；Linux Wayland 无任务栏协议
# 站桩 Err，X11 后端建成后可补；web/mobile 无此概念 Err 垫底）
skip-taskbar = []
# 系统托盘图标+菜单（tray-icon 三桌面通吃——Win/macOS 默认后端、
# Linux ksni 纯 D-Bus 免 GTK；菜单 API 走 tray_icon::menu 再导出，
# 刻意不单独直依赖 muda——防双 muda 版本 MenuEvent receiver 错位；
# web/mobile 无此概念 Err 垫底）
tray = ["dep:tray-icon"]

[dependencies]
starfish-debug = { workspace = true }
raw-window-handle = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

# 桌面：wgpu_auto 的阻塞初始化（wasm 无阻塞模型）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }

# wasm 变体：Web canvas 句柄类型（WebCanvasWindowHandle）
[target.'cfg(target_arch = "wasm32")'.dependencies]
raw-window-handle = { workspace = true, features = ["wasm-bindgen-0-2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
# 系统托盘（feature tray；MSRV 1.90——workspace toolchain ≥ 1.90 前提）
tray-icon = { version = "0.26", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
# 系统托盘（feature tray；objc2 后端——主线程 = 窗口线程亲和正合）
tray-icon = { version = "0.26", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-ui-kit = { workspace = true }
objc2-quartz-core = { workspace = true }
objc2-foundation = { workspace = true }
# platform/ios/mod.rs 直接 use：CGRect（默认特性）+ CFRunLoop（需此 feature）
objc2-core-foundation = { workspace = true, features = ["CFRunLoop"] }

# Linux 后端：Wayland-only（X11 已弃）。system：wgpu 互操作需真实
# wl_display*/wl_surface* 指针；dlopen：运行期加载 libwayland。
# sctk 关 calloop（本库 poll 模型自带非阻塞泵），留 xkbcommon
# （C 链接依赖，构建需 pkg-config + libxkbcommon-dev）。
# OHOS 摘除：rustc 对 ohos 目标 target_os="linux" + target_env="ohos"
# （2026-11-11 实测）——不分流时 Wayland 依赖链会进 OHOS 构建而 OHOS
# 无 Wayland 合成器；not(target_env="ohos") 显式排除（harmonyos 分流桩
# 见 src/platform/harmonyos/mod.rs）。
[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
wayland-client = { workspace = true }
smithay-client-toolkit = { workspace = true }
sctk-adwaita = { workspace = true }
# 事件泵的零超时可读探测（libwayland wl_display_read_events 无数据时
# 阻塞，须先 poll(POLLIN, 0)——树内既有传递依赖，零新增体积）
libc = "0.2"
# 系统托盘（feature tray；ksni 纯 D-Bus 后端——免 GTK 系统依赖，
# Ubuntu 自带 AppIndicator 扩展可显示 StatusNotifierItem）
tray-icon = { version = "0.26", optional = true, default-features = false, features = [
    "ksni",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { workspace = true }
# 运行时屏幕方向（set_orientation：ndk-context 拿 Activity + jni-sys 裸调
# setRequestedOrientation——最小面，免 jni crate 依赖）
ndk-context = { workspace = true }
jni-sys = "0.3"
# 资产/目录句柄移交 starfish-io（资源读取语义归 io 层——we 只做移交，2026-11-02 定约）
starfish-io = { workspace = true }

# Web（wasm32-unknown-unknown）：DOM 事件 / canvas 接管 / rAF 帧拍
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
