# starfish-rewrite 项目级构建配置
# wasm32-unknown-unknown：无需特殊 linker/rustflags，JS 胶水由
# wasm-bindgen-cli 生成（版本须与依赖树 wasm-bindgen 严格一致，当前 0.2.127）：
#   cargo build --release --target wasm32-unknown-unknown --example hello
#   wasm-bindgen --out-dir web --target web target/wasm32-unknown-unknown/release/examples/hello.wasm
#
# Android（手动链，无 xtask 前提下）：
#   cargo ndk -t arm64-v8a -P 26 -o jniLibs -- build --release --example hello_android
#   （llvm-strip → 替换 APK 内 lib/<abi>/*.so → zipalign 4 → apksigner，
#     全流程见 doc/log/starfish_changelog_2026-09-27.md 批次一）

# ── Android APK 打包：统一走 pygame-rs/scripts/build_apk.py（批次二十一，
#    xtask 已退役）——python pygame-rs/scripts/build_apk.py <示例名> [--dir .] ──
